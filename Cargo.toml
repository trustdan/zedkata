[workspace]
resolver = "2"
members = [
    "crates/zedkata-core",
    "crates/zedkata-lsp",
    "crates/zedkata-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Zedkata Contributors"]

[workspace.dependencies]
zedkata-core = { path = "crates/zedkata-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "io-std", "sync"] }
ratatui = "0.26"
crossterm = "0.27"
chrono = { version = "0.4", features = ["serde"] }
