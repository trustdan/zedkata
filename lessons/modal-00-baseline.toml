[lesson]
id = "modal-00-baseline"
title = "Modal baseline"
module = 0
requires = []
concepts = ["i", "a", "Esc", "ctrl-[", "h", "j", "k", "l", "u", "g ]"]

prose = """
Modal editing separates cursor movement from text entry.
In Normal mode, the block cursor rests on a character: `i` enters Insert mode before it,
and `a` appends after it. Exit Insert mode with `<Esc>` or `Ctrl-[` to commit atomic edits.
Zed renders diagnostic errors inline directly beneath problematic code.
"""

# ---------------------------------------------------------------------------

[[exercise]]
id = "insert-visibility"
task = "Make the 'timeout_ms' field public on line 2."
start = "fixtures/modal-00/insert-visibility.start.kata"
goal = "fixtures/modal-00/insert-visibility.goal.kata"
par_edits = 1
max_edits = 2
cursor = [2, 5]
hint = "Enter insert mode before the cursor to insert the visibility modifier."

[exercise.forbid]
backspace_run = 3

# ---------------------------------------------------------------------------

