# ---------------------------------------------------------------------------
# Not drillable — routes to zedkata-agent as a guided walkthrough.

[[walkthrough]]
id = "diagnostic-navigation"
title = "Inline diagnostics and error jumping in Zed"
prompt = """
Demonstrate Zed's native inline diagnostic rendering. In standard Vim, diagnostics
typically populate the sign column, quickfix list, or a floating hover window. In Zed,
syntax and compiler diagnostics render inline directly below the problematic line.
Guide the student to introduce a deliberate syntax mistake, observe the inline diagnostic
display, jump to next/previous diagnostics using `g ]` and `g [`, and restore the clean buffer with `u`.
"""
