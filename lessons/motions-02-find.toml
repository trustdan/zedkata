[lesson]
id = "motions-02-find"
title = "Character find motions"
module = 2
requires = ["motions-01-word"]
concepts = ["f", "F", "t", "T", ";", ",", "df", "dt", "ct"]

prose = """
In-line character find jumps precisely to targets without counting words.
`f` finds forward inclusive, while `t` stops till the character. `F` and `T` search backward.
Repeat with `;` or reverse with `,`. Combined with `d` or `c`, find motions make surgical
edits inside compound identifiers and delimited values. Zed find motions stay on the current line.
"""

# ---------------------------------------------------------------------------

[[exercise]]
id = "delete-find-delimiter"
task = "Remove the 'legacy_' prefix including the underscore from the function call on line 2."
start = "fixtures/motions-02/delete-find-delimiter.start.kata"
goal = "fixtures/motions-02/delete-find-delimiter.goal.kata"
par_edits = 1
max_edits = 2
