# Not drillable — routes to zedkata-agent as a guided walkthrough.

[[walkthrough]]
id = "single-line-find-scope"
title = "Single-line find scope and repeat motions in Zed"
prompt = """
Explain Zed's single-line character search behavior (`\"multiline\": false`). In standard Vim, find
motions (`f`/`t`) can optionally cross line boundaries depending on plugins. In Zed's native Vim
emulation, character searches are strictly scoped to the active line. Demonstrate navigating across
multiple instances of a character on a line using `;` (repeat forward) and `,` (repeat backward),
and explain how Zed safely confines search motions to prevent unexpected multiline jumps.
"""
