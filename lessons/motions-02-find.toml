[lesson]
id = "motions-02-find"
title = "Character find motions"
module = 2
requires = ["motions-01-word"]
concepts = ["f", "F", "t", "T", ";", ",", "df", "dt", "ct"]
draft = false
prose = """
Character find motions jump directly to a specific character on the current line:
- `f<char>` finds and lands *on* the next occurrence of `<char>` (inclusive when paired with `d` or `c`).
- `t<char>` moves *till* just before the next occurrence of `<char>` (leaving `<char>` untouched when paired with `d` or `c`).
- Combine with `d` (delete) or `c` (change): `df_` deletes through `_`, `dt:` deletes up to `:`, and `ct:` replaces everything up to `:` and enters Insert mode.
"""

[[exercise]]
id = "delete-find-delimiter"
task = "Delete the 'folder_' prefix (including the underscore '_') on line 2 using 'df_'."
start = "fixtures/motions-02/delete-find-delimiter.start.kata"
goal = "fixtures/motions-02/delete-find-delimiter.goal.kata"
par_edits = 1
max_edits = 2
cursor = [2, 5]
hint = "Use 'df_' to delete from the cursor through and including the first '_' character."

[exercise.forbid]
backspace_run = 3

[[exercise]]
id = "delete-till-char"
task = "Delete 'building1' inside the quotes on line 2 while keeping ':room-204' (press dt:)."
start = "fixtures/motions-02/delete-till-char.start.kata"
goal = "fixtures/motions-02/delete-till-char.goal.kata"
par_edits = 1
max_edits = 2
cursor = [2, 17]
hint = "Use 'dt:' (delete till ':') to remove 'building1' while leaving the ':' delimiter intact."

[exercise.forbid]
backspace_run = 3

[[exercise]]
id = "change-till-char"
task = "Change 'status_note' to 'state' on line 2 while keeping the colon ':' (press ct:, type 'state', then press Esc)."
start = "fixtures/motions-02/change-till-char.start.kata"
goal = "fixtures/motions-02/change-till-char.goal.kata"
par_edits = 1
max_edits = 2
cursor = [2, 5]
hint = "Use 'ct:' to delete up to the colon ':' and enter Insert mode in a single step, then type 'state' and press 'Esc'."

[exercise.forbid]
backspace_run = 3

[[walkthrough]]
id = "single-line-find-scope"
title = "Single-line find motions and repeat (; / ,)"
prompt = """
In both Vim and Zed, `f`, `F`, `t`, and `T` search strictly within the **current line** (`vim.multiline_find_char` defaults to `false`).

When a line contains multiple occurrences of your target character:
1. Press `f<char>` or `t<char>` once to jump to the first match.
2. Press `;` to repeat the last find motion in the same direction, or `,` to repeat it in the opposite direction.
3. Combine with an operator (`df<char>`, `dt<char>`, `cf<char>`, `ct<char>`) for surgical single-edit changes without counting words.
"""
