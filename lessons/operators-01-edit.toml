# Core operators, counts, and repetition in Zed.
# Module 4 in curriculum-module-map.md, depending on motions-03-textobjects.

[lesson]
id = "operators-01-edit"
title = "Core operators and repeat"
module = 4
draft = false
requires = ["motions-03-textobjects"]
concepts = ["r", "count", "indent", "dot-repeat", "surround"]

prose = """
Operators act on motions and text objects, but also work with counts and line
modifiers. Single-character replace and linewise indentation execute immediate
buffer edits, while count prefixes multiply an operation into a single atomic
edit unit. Zed also includes native surround commands out of the box.
"""

# ---------------------------------------------------------------------------

[[exercise]]
id = "replace-char-literal"
task = "Replace the erroneous 'u' type suffix with 'i' on line 2."
start = "fixtures/operators-01/replace-char.start.kata"
goal = "fixtures/operators-01/replace-char.goal.kata"
par_edits = 1
max_edits = 2
cursor = [2, 29]
hint = "Replace the single character at the cursor without entering insert mode."

[exercise.forbid]
backspace_run = 3

# ---------------------------------------------------------------------------

[[exercise]]
id = "delete-counted-words"
task = "Delete the two modifier keywords 'pub unsafe' on line 1, leaving the function declaration."
start = "fixtures/operators-01/delete-counted-words.start.kata"
goal = "fixtures/operators-01/delete-counted-words.goal.kata"
par_edits = 1
max_edits = 2
cursor = [1, 1]
hint = "Use a numerical count with the word deletion operator to remove both keywords at once."

[exercise.forbid]
backspace_run = 3

# ---------------------------------------------------------------------------

[[exercise]]
id = "indent-line-block"
task = "Indent the match arm on line 3 to align with the rest of the match block."
start = "fixtures/operators-01/indent-line-block.start.kata"
goal = "fixtures/operators-01/indent-line-block.goal.kata"
par_edits = 1
max_edits = 2
