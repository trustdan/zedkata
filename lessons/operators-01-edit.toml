[[walkthrough]]
id = "exchange-and-surround"
title = "Built-in surround (cs/ds/ys) and exchange (gs) in Zed"
prompt = """
Unlike vanilla Vim—which requires external plugins like `vim-surround` and `vim-exchange`—Zed ships both operator families out of the box in `vim_mode = true`:

1. **Surround (`cs`, `ds`, `ys`)**:
   - `cs"'` changes surrounding double quotes `"..."` to single quotes `'...'`.
   - `ds)` deletes the surrounding parentheses `(...)`.
   - `ysiw"` wraps the inner word (`iw`) in double quotes `"..."`.
2. **Exchange (`gs`)**:
   - Press `gsiw` on the first word to mark it for exchange.
   - Move to another word and press `gsiw` to swap the two words in place (`gS` clears a pending exchange).
"""

[[walkthrough]]
id = "keymap-contexts"
title = "Customizing operator keymaps in ~/.config/zed/keymap.json"
prompt = """
When customizing Vim bindings in `~/.config/zed/keymap.json`, Zed uses explicit context predicates so Normal-mode bindings do not collide with Insert mode or operator-pending state:

- `"context": "Editor && vim_mode == normal && !VimWaiting && !menu"` — standard Normal mode.
- `"context": "Editor && vim_operator == a || vim_operator == i"` — custom text-object targets.
- `"context": "Editor && vim_mode == visual"` — Visual selection bindings.
"""
