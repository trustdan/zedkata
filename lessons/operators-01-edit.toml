[lesson]
id = "operators-01-edit"
title = "Core operators and repeat"
module = 4
requires = ["motions-03-textobjects"]
concepts = ["d", "c", "y", "r", ".", ">", "<", "g~", "g s", "c s", "d s", "y s"]
draft = false
prose = """
In Vim mode, editing follows a simple grammar: `[count] + operator + motion` (or doubled for a whole line, like `dd` or `>>`):
- `r<char>` replaces the single character under the cursor with `<char>` and stays in Normal mode.
- Adding a count multiplies the motion or operator: `2dw` (or `d2w`) deletes two words in a single edit.
- `>>` indents the current line right by one level; `<<` unindents it left.
- `.` repeats your last Normal-mode change anywhere else in the file.
"""

[[exercise]]
id = "replace-char-literal"
task = "Fix the typo 'tume' -> 'time' on line 2 by replacing 'u' with 'i' in place (press ri)."
start = "fixtures/operators-01/replace-char.start.kata"
goal = "fixtures/operators-01/replace-char.goal.kata"
par_edits = 1
max_edits = 2
cursor = [2, 29]
hint = "Your cursor starts on the 'u' in 'tume'. Press 'ri' to replace that single character with 'i' without entering Insert mode."

[exercise.forbid]
backspace_run = 3

