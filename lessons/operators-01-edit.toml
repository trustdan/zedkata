hint = "Shift the current line right using the linewise indent operator."

[exercise.forbid]
backspace_run = 3

# ---------------------------------------------------------------------------
# Not drillable — routes to zedkata-agent as a guided walkthrough.

[[walkthrough]]
id = "exchange-and-surround"
title = "Text exchange vs surround operators"
prompt = """
Demonstrate the difference between external plugins like vim-exchange and
Zed's native modal capabilities. Zed does not bundle vim-exchange ('cx'),
relying on delete-and-paste ('dd', 'p') or editor line-swap shortcuts.
Conversely, vim-surround ('cs', 'ds', 'ys') is built in natively.
"""

# ---------------------------------------------------------------------------
# Not drillable — routes to zedkata-agent as a guided walkthrough.

[[walkthrough]]
id = "keymap-contexts"
title = "Keymap contexts and modal binding customization"
prompt = """
Configure and inspect custom keybindings in Zed using context expressions.
Demonstrate scoping shortcuts to 'Editor && vim_mode == normal', using the
'VimControl' helper across normal/visual/operator states, and inspecting
active context trees with the 'dev: open key context view' command.
"""
